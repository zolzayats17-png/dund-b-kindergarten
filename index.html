<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="googlebot" content="noindex, nofollow">
<title>Дунд бүлэг · 33 дугаар цэцэрлэг</title>

<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1B2340;
    --ink-soft:#5A648A;
    --paper:#F6F8FF;
    --card:#FFFFFF;
    --news:#2E6BE6;
    --today:#0FA47B;
    --lesson:#7C4DE0;
    --talk:#E39A0C;
    --idea:#E0567F;
    --line:#E4E9F7;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif; font-weight:600;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Fredoka',sans-serif; font-weight:600; letter-spacing:.2px}
  [x-cloak]{display:none!important}
  button{font-family:inherit}
  input,textarea,select{font-family:inherit; font-weight:600}
  input:focus,textarea:focus,select:focus{outline:3px solid rgba(46,107,230,.25); outline-offset:1px}
  button:focus-visible{outline:3px solid rgba(46,107,230,.45); outline-offset:2px}

  .wrap{max-width:640px; margin:0 auto; padding:0 16px}
  .wrap-lg{max-width:1000px; margin:0 auto; padding:0 16px}
  .shell{max-width:1000px; margin:0 auto; padding:0 16px}

  .seclabel{font-size:12.5px; font-weight:800; color:#3B3080; margin:18px 0 10px; display:flex; align-items:center; gap:7px}
  .menu-btn{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#fff; border:1px solid var(--line); border-radius:20px; padding:10px 12px;
    cursor:pointer; text-align:left; margin-bottom:10px;
    box-shadow:0 6px 18px -15px rgba(27,35,64,.55); transition:transform .12s;
  }
  .menu-btn:active{transform:scale(.985)}
  .menu-btn .l{display:flex; align-items:center; gap:11px; font-weight:800; font-size:14.5px; color:var(--ink); line-height:1.3}
  .menu-btn .tile{width:38px; height:38px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:19px; flex:0 0 38px}
  .menu-btn .n{background:#EEF1FA; color:#5A648A; font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px; flex:0 0 auto}
  .menu-btn[data-on="true"] .l{color:#fff}
  .menu-btn[data-on="true"] .n{background:rgba(255,255,255,.3); color:#fff}
  .menu-btn[data-on="true"]{border-color:transparent}
  .backbtn{
    display:inline-flex; align-items:center; gap:7px; border:0; cursor:pointer;
    background:#EEF1FA; color:var(--ink); font-weight:800; font-size:13.5px;
    padding:10px 15px; border-radius:999px; margin:16px 0 4px;
  }
  @media(min-width:900px){
    .shell{display:grid; grid-template-columns:296px 1fr; gap:24px; align-items:start}
    .sidebar{display:block!important; position:sticky; top:18px}
    .pane{display:block!important}
    .backbtn{display:none!important}
  }

  /* ---- header ---- */
  .topbar{
    background:linear-gradient(120deg,#2E6BE6 0%,#7C4DE0 48%,#E0567F 100%);
    color:#fff; border-radius:0 0 30px 30px; padding:18px 0 22px;
    box-shadow:0 10px 30px -14px rgba(46,45,120,.55);
    position:relative; overflow:hidden;
  }
  .topbar::after{
    content:""; position:absolute; right:-40px; top:-50px; width:170px; height:170px;
    border-radius:50%; background:rgba(255,255,255,.13);
  }
  .topbar h1{font-size:20px; margin:0; line-height:1.25}
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.35);
    padding:5px 12px; border-radius:999px; font-size:12.5px; font-weight:800;
  }

  /* ---- cards ---- */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:22px;
    padding:16px; box-shadow:0 6px 18px -14px rgba(27,35,64,.5);
  }
  .tag{display:inline-block; padding:4px 11px; border-radius:999px; font-size:12px; font-weight:800}
  .meta{font-size:12.5px; color:var(--ink-soft); font-weight:700}

  /* ---- bottom nav ---- */
  /* --- */

  /* ---- forms / buttons ---- */
  .field{
    width:100%; border:1.5px solid var(--line); background:#FBFCFF; border-radius:14px;
    padding:11px 13px; font-size:14.5px; color:var(--ink);
  }
  .lab{display:block; font-size:12.5px; font-weight:800; color:var(--ink-soft); margin:0 0 5px}
  .btn{
    border:0; border-radius:14px; padding:12px 18px; font-weight:800; font-size:14px;
    color:#fff; cursor:pointer; box-shadow:0 8px 18px -10px rgba(27,35,64,.6);
  }
  .btn-ghost{background:#EEF1FA; color:var(--ink); box-shadow:none}
  .fab{
    position:fixed; right:16px; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:35;
    border:0; border-radius:999px; color:#fff; padding:14px 20px; font-weight:800; font-size:14.5px;
    box-shadow:0 14px 26px -10px rgba(27,35,64,.65); cursor:pointer;
    display:inline-flex; align-items:center; gap:8px;
  }

  /* ---- sheet ---- */
  .veil{position:fixed; inset:0; background:rgba(20,25,50,.55); backdrop-filter:blur(3px); z-index:50; display:flex; align-items:flex-end; justify-content:center}
  .sheet{
    background:#fff; width:100%; max-width:640px; border-radius:26px 26px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:92vh; overflow-y:auto;
  }
  @media(min-width:641px){
    .veil{align-items:center}
    .sheet{border-radius:26px; max-height:88vh}
  }
  .grip{width:44px; height:5px; border-radius:999px; background:#DFE4F2; margin:0 auto 14px}

  .thumb{border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#0D1330; aspect-ratio:4/3}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .filechip{
    display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink);
    background:#F2F5FD; border:1px solid var(--line); border-radius:12px; padding:9px 12px; font-size:13px; font-weight:800;
  }
  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(88px + env(safe-area-inset-bottom));
    background:#1B2340; color:#fff; padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:800;
    z-index:60; box-shadow:0 14px 30px -12px rgba(0,0,0,.6); max-width:88vw; text-align:center;
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>

      <span class="n" x-text="talks.length"></span>
    </button>

    <button class="menu-btn" :data-on="tab==='idea'"   :style="tab==='idea'   ? 'background:linear-gradient(120deg,#E0567F,#F0789E)' : ''" @click="go('idea')">

    <!-- ===== 1. МЭДЭЭЛЭЛ ===== -->

        <div class="card" style="text-align:center; border-style:dashed">

          <p style="margin:8px 0 0; font-size:14px">Одоогоор мэдээлэл алга.</p>
          <p class="meta" x-show="canPost">Доорх товчоор эхний мэдээллээ нийтэлнэ үү.</p>
        </div>

      <div style="display:grid; gap:14px">
        <template x-for="n in news" :key="n.id">
          <article class="card">
            <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start">
              <div>

            <div x-show="n.files.length" style="margin-top:12px" x-html="filesHtml(n.files)"></div>
          </article>
        </template>
      </div>
    </section>

    <!-- ===== ХҮҮХДИЙН МЭДЭЭЛЭЛ ===== -->
    <section x-show="tab==='children' && staff">
      <h2 style="font-size:19px; margin:0 0 2px">Хүүхдийн мэдээлэл</h2>
      <p class="meta" style="margin:0 0 6px">Дунд бүлгийн хүүхдүүдийн бүртгэл, эцэг эхийн холбоо барих мэдээлэл.</p>
      <p class="meta" style="margin:0 0 14px; color:#B37A00">🔒 Энэ хэсгийг зөвхөн багш, удирдлага харна.</p>

      <template x-if="students.length === 0">
        <div class="card" style="text-align:center; border-style:dashed">
          <div style="font-size:34px">👶</div>
          <p style="margin:8px 0 0; font-size:14px">Хүүхэд бүртгэгдээгүй байна.</p>
        </div>
      </template>

      <div style="display:grid; gap:14px">
        <template x-for="c in students" :key="c.id">
          <article class="card">
            <div style="display:flex; gap:13px; align-items:flex-start">
              <template x-if="c.photo">
                <img :src="c.photo" alt="" style="width:64px; height:64px; border-radius:18px; object-fit:cover; flex:0 0 64px; border:2px solid #E3F6F8">
              </template>
              <template x-if="!c.photo">
                <div style="width:64px; height:64px; border-radius:18px; flex:0 0 64px; background:#E3F6F8; display:flex; align-items:center; justify-content:center; font-size:27px" x-text="c.gender === 'Охин' ? '👧' : '👦'"></div>
              </template>

              <div style="flex:1; min-width:0">
                <h3 style="font-size:16.5px; margin:0 0 5px" x-text="c.name"></h3>
                <div style="display:flex; flex-wrap:wrap; gap:6px">
                  <span x-show="c.age" class="tag" style="background:#E3F6F8; color:#0A6B75" x-text="c.age + ' настай'"></span>
                  <span x-show="c.gender" class="tag" style="background:#EEF1FA; color:#3B4670" x-text="c.gender"></span>
                </div>
              </div>

              <div x-show="canPost" style="display:flex; gap:6px; flex:0 0 auto">
                <button @click="openForm(c)" class="btn btn-ghost" style="padding:7px 10px">✏️</button>
                <button @click="delStudent(c)" class="btn btn-ghost" style="padding:7px 10px">🗑</button>
              </div>
            </div>

            <div x-show="c.parentName || c.parentPhone" style="margin-top:12px; background:#F5FBFC; border:1px solid #D7EEF1; border-radius:14px; padding:11px 13px">

              <p style="margin:0; font-size:14.5px" x-text="c.parentName"></p>
              <template x-if="c.parentPhone">
                <a :href="'tel:' + c.parentPhone" style="font-size:15px; font-weight:800; color:#0E9BA8; text-decoration:none" x-text="'📞 ' + c.parentPhone"></a>
              </template>
            </div>

            <p x-show="c.note" class="meta" style="margin:10px 0 0" x-text="'📝 ' + c.note"></p>
            <div x-show="c.files.length" style="margin-top:12px" x-html="filesHtml(c.files)"></div>
          </article>
        </template>
      </div>
    </section>

    <!-- ===== СУРГАЛТ ҮЙЛ АЖИЛЛАГАА ===== -->
    <section x-show="tab==='lesson'">
      <h2 style="font-size:19px; margin:0 0 2px">Сургалт үйл ажиллагаа</h2>
      <p class="meta" style="margin:0 0 14px">Хөтөлбөрийн дагуу зохион байгуулсан хичээл, үйл ажиллагааны төлөвлөгөө.</p>

      <div style="display:flex; gap:7px; overflow-x:auto; padding-bottom:12px; -webkit-overflow-scrolling:touch">
        <button class="tag" @click="areaFilter='Бүгд'"
                :style="areaFilter==='Бүгд' ? 'background:#7C4DE0;color:#fff' : 'background:#F0EBFC;color:#5A32B0'"
                style="border:0; cursor:pointer; white-space:nowrap; padding:7px 13px">Бүгд</button>
        <template x-for="a in areas" :key="a">
          <button class="tag" @click="areaFilter=a"
                  :style="areaFilter===a ? 'background:#7C4DE0;color:#fff' : 'background:#F0EBFC;color:#5A32B0'"
                  style="border:0; cursor:pointer; white-space:nowrap; padding:7px 13px" x-text="a"></button>
        </template>
      </div>

      <template x-if="filteredLessons.length === 0">
        <div class="card" style="text-align:center; border-style:dashed">
          <div style="font-size:34px">📚</div>
          <p style="margin:8px 0 0; font-size:14px">Энд бичлэг алга.</p>
          <p class="meta" x-show="canPost">Хичээлийн төлөвлөгөөгөө нэмж эхлээрэй.</p>
        </div>
      </template>

      <div style="display:grid; gap:14px">
        <template x-for="l in filteredLessons" :key="l.id">
          <article class="card">
            <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start">
              <div>
                <div style="display:flex; flex-wrap:wrap; gap:6px">
                  <span class="tag" style="background:#F0EBFC; color:#5A32B0" x-text="'🗓 ' + l.date"></span>
                  <span class="tag" style="background:#EEF1FA; color:#3B4670" x-text="l.area"></span>
                </div>
                <h3 style="font-size:16.5px; margin:9px 0 0" x-text="l.topic"></h3>
              </div>
              <button x-show="canPost" @click="removeItem('learning_activities','lessons',l.id)" class="btn btn-ghost" style="padding:7px 10px">🗑</button>
            </div>

            <template x-if="l.goal">
              <div style="margin-top:11px; background:#F3FBF8; border:1px solid #CFEDE2; border-radius:14px; padding:12px">
                <p class="meta" style="margin:0 0 4px; color:#0B6B52">🎯 Зорилго</p>
                <p style="margin:0; font-size:14.5px; line-height:1.6; white-space:pre-line" x-text="l.goal"></p>
              </div>
            </template>

            <template x-if="l.content">
              <p style="margin:11px 0 0; font-size:14.5px; line-height:1.6; white-space:pre-line" x-text="l.content"></p>
            </template>

            <template x-if="l.materials">
              <p class="meta" style="margin:11px 0 0" x-text="'🧰 Хэрэглэгдэхүүн: ' + l.materials"></p>
            </template>

            <div x-show="l.files.length" style="margin-top:12px" x-html="filesHtml(l.files)"></div>
          </article>
        </template>
      </div>
    </section>

    <!-- ===== 2. ӨНӨӨДӨР ЮУ ХИЙСЭН БЭ? ===== -->
    <section x-show="tab==='today'">
      <h2 style="font-size:19px; margin:0 0 2px">Өдөр тутмын ажиглалт</h2>
      <p class="meta" style="margin:0 0 14px">Дунд бүлгийн хүүхдүүдийн өдөр тутмын үйл ажиллагааны баримт.</p>

      <div x-show="students.length" style="display:flex; gap:7px; overflow-x:auto; padding-bottom:12px; -webkit-overflow-scrolling:touch">
        <button class="tag" @click="whoFilter='Бүгд'"
                :style="whoFilter==='Бүгд' ? 'background:#0FA47B;color:#fff' : 'background:#EAF6F2;color:#0B6B52'"
                style="border:0; cursor:pointer; white-space:nowrap; padding:7px 13px">Бүгд</button>
        <template x-for="s in students" :key="s.id">
          <button class="tag" @click="whoFilter=s.name"
                  :style="whoFilter===s.name ? 'background:#0FA47B;color:#fff' : 'background:#EAF6F2;color:#0B6B52'"
                  style="border:0; cursor:pointer; white-space:nowrap; padding:7px 13px" x-text="s.name"></button>
        </template>
      </div>

      <template x-if="filteredToday.length === 0">
        <div class="card" style="text-align:center; border-style:dashed">
          <div style="font-size:34px">🎨</div>
          <p style="margin:8px 0 0; font-size:14px">Энд бичлэг алга.</p>
          <p class="meta" x-show="canPost">Өнөөдрийн үйл ажиллагаагаа тэмдэглэж үлдээгээрэй.</p>
        </div>
      </template>

      <div style="display:grid; gap:14px">
        <template x-for="t in filteredToday" :key="t.id">
          <article class="card">
            <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start">
              <div>
                <div style="display:flex; flex-wrap:wrap; gap:6px">
                  <span class="tag" style="background:#EAF6F2; color:#0B6B52" x-text="'🗓 ' + t.date"></span>
                  <span class="tag" style="background:#EEF1FA; color:#3B4670" x-text="t.who"></span>
                </div>
                <h3 style="font-size:16.5px; margin:9px 0 0" x-text="t.title"></h3>
              </div>
              <button x-show="canPost" @click="removeItem('daily_observations','today',t.id)" class="btn btn-ghost" style="padding:7px 10px">🗑</button>
            </div>
            <p style="margin:10px 0 0; font-size:14.5px; line-height:1.6; white-space:pre-line" x-text="t.content"></p>
            <div x-show="t.files.length" style="margin-top:12px" x-html="filesHtml(t.files)"></div>
          </article>
        </template>
      </div>
    </section>

    <!-- ===== 3. ЯРИЛЦЛАГЫН ТЭМДЭГЛЭЛ ===== -->
    <section x-show="tab==='talk'">
      <h2 style="font-size:19px; margin:0 0 2px">Ярилцлагын тэмдэглэл</h2>
      <p class="meta" style="margin:0 0 14px">Багшийн тавьсан асуулт, хүүхдүүдийн хариулт, дүгнэлт.</p>

      <div x-show="students.length" style="display:flex; gap:7px; overflow-x:auto; padding-bottom:12px; -webkit-overflow-scrolling:touch">
        <button class="tag" @click="talkFilter='Бүгд'"
                :style="talkFilter==='Бүгд' ? 'background:#E39A0C;color:#fff' : 'background:#FDF2DC;color:#8A6207'"
                style="border:0; cursor:pointer; white-space:nowrap; padding:7px 13px">Бүгд</button>
        <template x-for="st in students" :key="st.id">
          <button class="tag" @click="talkFilter=st.name"
                  :style="talkFilter===st.name ? 'background:#E39A0C;color:#fff' : 'background:#FDF2DC;color:#8A6207'"
                  style="border:0; cursor:pointer; white-space:nowrap; padding:7px 13px" x-text="st.name"></button>
        </template>
      </div>

      <template x-if="filteredTalks.length === 0">
        <div class="card" style="text-align:center; border-style:dashed">
          <div style="font-size:34px">💬</div>
          <p style="margin:8px 0 0; font-size:14px">Ярилцлага бүртгэгдээгүй байна.</p>
        </div>
      </template>

      <div style="display:grid; gap:14px">
        <template x-for="q in filteredTalks" :key="q.id">
          <article class="card">
            <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start">
              <div>
                <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:7px">
                  <span class="tag" style="background:#FDF2DC; color:#8A6207" x-text="'🗓 ' + q.date"></span>
                  <span class="tag" style="background:#EEF1FA; color:#3B4670" x-text="q.who"></span>
                </div>
                <h3 style="font-size:16.5px; margin:0; line-height:1.4" x-text="'❓ ' + q.question"></h3>
              </div>
              <button x-show="canPost" @click="removeItem('interview_notes','talks',q.id)" class="btn btn-ghost" style="padding:7px 10px">🗑</button>
            </div>
            <template x-if="q.response">
              <div style="margin-top:11px; background:#FFF8E9; border:1px solid #F6E2B4; border-radius:14px; padding:12px">
                <p style="margin:0; font-size:14.5px; line-height:1.6; white-space:pre-line" x-text="q.response"></p>
              </div>
            </template>
            <div x-show="q.files.length" style="margin-top:12px" x-html="filesHtml(q.files)"></div>
          </article>
        </template>
      </div>
    </section>

    <!-- ===== 4. САНАЛ ХҮСЭЛТ ===== -->
    <section x-show="tab==='idea'">
      <h2 style="font-size:19px; margin:0 0 2px">Санал хүсэлт</h2>
      <p class="meta" style="margin:0 0 14px">Эцэг эхчүүд саналаа энд үлдээнэ.</p>

      <div class="card" style="margin-bottom:16px; border-color:#F7D3DF; background:#FFF7FA">
        <h3 style="font-size:15px; margin:0 0 12px">Санал бичих</h3>
        <label class="lab">Таны нэр</label>
        <input class="field" x-model="ideaForm.sender" placeholder="Жишээ: Анарын ээж Цэцэгмаа">
        <label class="lab" style="margin-top:11px">Төрөл</label>
        <select class="field" x-model="ideaForm.type">
          <option>Талархал</option><option>Санал</option><option>Хүсэлт</option><option>Гомдол</option>
        </select>
        <label class="lab" style="margin-top:11px">Агуулга</label>
        <textarea class="field" rows="3" x-model="ideaForm.content" placeholder="Бичихийг хүссэн зүйлээ энд бичнэ үү..."></textarea>
        <button class="btn" style="width:100%; margin-top:12px; background:linear-gradient(120deg,#E0567F,#F0789E)"
                @click="sendIdea()" x-text="busy ? 'Илгээж байна...' : 'Илгээх'"></button>
      </div>

      <template x-if="ideas.length === 0">
        <div class="card" style="text-align:center; border-style:dashed">
          <div style="font-size:34px">💌</div>
          <p style="margin:8px 0 0; font-size:14px">Одоогоор санал алга.</p>
        </div>
      </template>

      <div style="display:grid; gap:14px">
        <template x-for="i in ideas" :key="i.id">
          <article class="card">
            <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start">
              <div>
                <span class="tag" style="background:#FDEBF1; color:#B32E58" x-text="i.type"></span>
                <h3 style="font-size:15.5px; margin:8px 0 2px" x-text="i.sender"></h3>
                <p class="meta" style="margin:0" x-text="i.date"></p>
              </div>
              <button x-show="canPost" @click="removeItem('parent_feedbacks','ideas',i.id)" class="btn btn-ghost" style="padding:7px 10px">🗑</button>
            </div>
            <p style="margin:10px 0 0; font-size:14.5px; line-height:1.6; white-space:pre-line" x-text="i.content"></p>
          </article>
        </template>
      </div>
    </section>

  </main>
  </div>

  <!-- FAB -->
  <button x-show="canPost && tab!=='idea'" class="fab" :style="'background:'+accent()" @click="openForm()">
    <span style="font-size:18px">＋</span><span x-text="fabLabel()"></span>
  </button>



  <!-- ===== POST SHEET ===== -->
  <div class="veil" x-show="formOpen" x-cloak @click.self="formOpen=false">
    <div class="sheet">
      <div class="grip"></div>
      <h3 style="font-size:17px; margin:0 0 14px" x-text="fabLabel()"></h3>

      <!-- news -->
      <template x-if="tab==='news'">
        <div>
          <label class="lab">Гарчиг</label>
          <input class="field" x-model="form.title" placeholder="Жишээ: Эцэг эхийн хурал">
          <label class="lab" style="margin-top:11px">Төрөл</label>
          <select class="field" x-model="form.category">
            <option>Зарлал</option><option>Мэдээ</option><option>Сануулга</option><option>Баяр ёслол</option>
          </select>
          <label class="lab" style="margin-top:11px">Агуулга</label>
          <textarea class="field" rows="5" x-model="form.content" placeholder="Дэлгэрэнгүй мэдээллээ бичнэ үү..."></textarea>
        </div>
      </template>

      <!-- children -->
      <template x-if="tab==='children'">
        <div>
          <label class="lab">Овог нэр</label>
          <input class="field" x-model="form.name" placeholder="Жишээ: Батжаргалын Анар">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:11px">
            <div>
              <label class="lab">Нас</label>
              <input class="field" type="number" min="1" max="7" x-model="form.age" placeholder="4">
            </div>
            <div>
              <label class="lab">Хүйс</label>
              <select class="field" x-model="form.gender">
                <option>Хүү</option><option>Охин</option>
              </select>
            </div>
          </div>
          <label class="lab" style="margin-top:11px">Эцэг эхийн нэр</label>
          <input class="field" x-model="form.parentName" placeholder="Жишээ: Д.Цэцэгмаа (ээж)">
          <label class="lab" style="margin-top:11px">Утасны дугаар</label>
          <input class="field" type="tel" x-model="form.parentPhone" placeholder="99112233">
          <label class="lab" style="margin-top:11px">Тэмдэглэл</label>
          <textarea class="field" rows="2" x-model="form.note" placeholder="Онцлох зүйл, анхаарах шаардлагатай мэдээлэл..."></textarea>
        </div>
      </template>

      <!-- lesson -->
      <template x-if="tab==='lesson'">
        <div>
          <label class="lab">Огноо</label>
          <input class="field" type="date" x-model="form.date">
          <label class="lab" style="margin-top:11px">Сургалтын чиглэл</label>
          <select class="field" x-model="form.area">
            <template x-for="a in areas" :key="a"><option x-text="a"></option></template>
          </select>
          <label class="lab" style="margin-top:11px">Сэдэв</label>
          <input class="field" x-model="form.topic" placeholder="Жишээ: Намрын навчаар зураг наах">
          <label class="lab" style="margin-top:11px">Зорилго</label>
          <textarea class="field" rows="2" x-model="form.goal" placeholder="Хүүхэд юу сурах, ямар чадвар эзэмших вэ..."></textarea>
          <label class="lab" style="margin-top:11px">Явц</label>
          <textarea class="field" rows="4" x-model="form.content" placeholder="Хичээл хэрхэн өрнөсөн..."></textarea>
          <label class="lab" style="margin-top:11px">Хэрэглэгдэхүүн</label>
          <input class="field" x-model="form.materials" placeholder="Навч, цаас, цавуу, өнгийн харандаа">
        </div>
      </template>

      <!-- today -->
      <template x-if="tab==='today'">
        <div>
          <label class="lab">Огноо</label>
          <input class="field" type="date" x-model="form.date">
          <label class="lab" style="margin-top:11px">Хэний тухай</label>
          <select class="field" x-model="form.who">
            <option>Дунд бүлэг</option>
            <template x-for="s in students" :key="s.id"><option x-text="s.name"></option></template>
          </select>
          <label class="lab" style="margin-top:11px">Гарчиг</label>
          <input class="field" x-model="form.title" placeholder="Жишээ: Намрын навчаар зураг наалаа">
          <label class="lab" style="margin-top:11px">Тайлбар</label>
          <textarea class="field" rows="5" x-model="form.content" placeholder="Хүүхдүүд юу хийсэн, хэрхэн оролцсоныг бичнэ үү..."></textarea>
        </div>
      </template>

      <!-- talk -->
      <template x-if="tab==='talk'">
        <div>
          <label class="lab">Хэнтэй ярилцсан</label>
          <select class="field" x-model="form.who">
            <option>Дунд бүлэг</option>
            <template x-for="st in students" :key="st.id"><option x-text="st.name"></option></template>
          </select>
          <label class="lab" style="margin-top:11px">Асуулт</label>
          <input class="field" x-model="form.question" placeholder="Жишээ: Ирээдүйд хэн болохыг хүсэж байна вэ?">
          <label class="lab" style="margin-top:11px">Хариулт, тэмдэглэл</label>
          <textarea class="field" rows="5" x-model="form.response" placeholder="Хүүхдүүдийн хариулт, багшийн дүгнэлт..."></textarea>
        </div>
      </template>

      <!-- files -->
      <label class="lab" style="margin-top:13px">Файл хавсаргах (зураг, PDF, Word…)</label>
      <input class="field" type="file" multiple @change="pickFiles($event)" style="padding:9px">
      <div x-show="staged.length" style="margin-top:8px; display:grid; gap:6px">
        <template x-for="(f,ix) in staged" :key="ix">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; background:#F2F5FD; border-radius:11px; padding:8px 11px">
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap" x-text="f.name"></span>
            <button @click="staged.splice(ix,1)" style="border:0; background:transparent; cursor:pointer; font-size:15px">✕</button>
          </div>
        </template>
      </div>

      <div style="display:flex; gap:9px; margin-top:16px">
        <button class="btn btn-ghost" style="flex:1" @click="formOpen=false">Болих</button>
        <button class="btn" style="flex:2" :style="'background:'+accent()" @click="savePost()"
                x-text="busy ? 'Хадгалж байна...' : 'Нийтлэх'"></button>
      </div>
    </div>
  </div>

  <!-- ===== SETTINGS SHEET ===== -->
  <div class="veil" x-show="menuOpen" x-cloak @click.self="menuOpen=false">
    <div class="sheet">
      <div class="grip"></div>

      <h3 style="font-size:17px; margin:0 0 4px">Тохиргоо</h3>
      <p class="meta" style="margin:0 0 16px" x-text="roleLabel()"></p>

      <template x-if="canPost">
        <div style="margin-bottom:20px">
          <h4 style="font-size:15px; margin:0 0 4px">Сурагчдын нэрс</h4>
          <p class="meta" style="margin:0 0 11px">Энд нэмсэн нэрс “Өдөр тутмын ажиглалт” хэсэгт сонголт болж гарна.</p>

          <div style="display:flex; gap:8px">
            <input class="field" x-model="newStudent" placeholder="Овог нэр" @keydown.enter="addStudent()">
            <button class="btn" style="background:var(--today); padding:11px 16px" @click="addStudent()">Нэмэх</button>
          </div>

          <div style="display:flex; flex-wrap:wrap; gap:7px; margin-top:12px">
            <template x-for="s in students" :key="s.id">
              <span class="tag" style="background:#EAF6F2; color:#0B6B52; display:inline-flex; align-items:center; gap:7px; padding:7px 12px">
                <span x-text="s.name"></span>
                <button @click="delStudent(s)" style="border:0; background:transparent; cursor:pointer; color:#0B6B52; font-size:14px">✕</button>
              </span>
            </template>
            <span x-show="!students.length" class="meta">Нэр бүртгээгүй байна.</span>
          </div>
        </div>
      </template>

      <button class="btn btn-ghost" style="width:100%" @click="signOut()">Гарах</button>
    </div>
  </div>

  <div class="toast" x-show="toast" x-cloak x-text="toast"></div>
</div>
</template>

<script>
/* ===== SUPABASE ===== */
const SUPABASE_URL      = 'https://deieszsomejoteglbgmo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_2Fgb7xq3c5X8uo07qLssfQ_Z__FiDUF';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CODES = { teacher:'3333', admin:'1234', parent:'1234' };
const BUCKET = 'files';
const day = t => (t || '').split('T')[0];

/* Монгол цагаан толгойн дараалал (Ө нь О-гийн дараа, Ү нь У-гийн дараа) */
const MN_ABC = 'абвгдеёжзийклмноөпрстуүфхцчшщъыьэюя';
function mnCompare(a, b) {
  const x = (a || '').toLowerCase().trim(), y = (b || '').toLowerCase().trim();
  const len = Math.max(x.length, y.length);
  for (let i = 0; i < len; i++) {
    const cx = x[i], cy = y[i];
    if (cx === undefined) return -1;
    if (cy === undefined) return 1;
    if (cx === cy) continue;
    let ix = MN_ABC.indexOf(cx), iy = MN_ABC.indexOf(cy);
    if (ix === -1) ix = 1000 + cx.charCodeAt(0);
    if (iy === -1) iy = 1000 + cy.charCodeAt(0);
    if (ix !== iy) return ix - iy;
  }
  return 0;
}
const sortStudents = list => [...list].sort((a, b) => mnCompare(a.name, b.name));
const esc = t => String(t || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function app() {
  return {
    codeInput:'', codeBad:false, pending:'', role:'',
    tab:'news', showMenu:true, menuOpen:false, formOpen:false, busy:false, toast:'',
    dbStatus:'offline', dbError:'',
    students:[], news:[], today:[], talks:[], ideas:[], lessons:[],
    areas:['Хэл яриа','Математик','Байгаль нийгмийн орчин','Хөдөлгөөн эрүүл мэнд','Нийгэм сэтгэл хөдлөл','Дүрслэх урлаг','Хөгжим','Бусад'],
    whoFilter:'Бүгд', areaFilter:'Бүгд', talkFilter:'Бүгд', newStudent:'', staged:[], editingId:'',
    form:{}, ideaForm:{ sender:'', type:'Талархал', content:'' },

    init() {
      try { this.role = sessionStorage.getItem('cls_role') || ''; } catch(e) {}
      if (this.role) this.load();
    },

    /* ---- нэвтрэх ---- */
    pick(r) { this.pending = r; this.codeBad = false; this.codeInput = ''; },
    pendingLabel() {
      return { teacher:'👩‍🏫 Багш', admin:'🏫 Удирдлага', parent:'👨‍👩‍👧 Эцэг эх' }[this.pending] || '';
    },
    pendingColor() {
      return { teacher:'linear-gradient(120deg,#0FA47B,#12B98A)',
               admin:'linear-gradient(120deg,#2E6BE6,#4F9BF0)',
               parent:'linear-gradient(120deg,#E0567F,#F0789E)' }[this.pending] || '#2E6BE6';
    },
    unlock() {
      if (this.pending && this.codeInput.trim() === CODES[this.pending]) {
        this.codeBad = false; this.codeInput = '';
        const r = this.pending; this.pending = '';
        this.setRole(r);
      } else { this.codeBad = true; }
    },
    setRole(r) {
      this.role = r;
      try { sessionStorage.setItem('cls_role', r); } catch(e) {}
      this.load();
    },
    signOut() {
      try { sessionStorage.removeItem('cls_role'); } catch(e) {}
      this.role = ''; this.pending = ''; this.codeInput = ''; this.menuOpen = false;
    },
    get canPost() { return this.role === 'teacher'; },
    get staff() { return this.role === 'teacher' || this.role === 'admin'; },
    roleLabel() {
      return { teacher:'👩‍🏫 Багшийн горим', admin:'🏫 Удирдлагын горим', parent:'👨‍👩‍👧 Эцэг эхийн горим' }[this.role] || '';
    },

    /* ---- туслах ---- */
    go(t) { this.tab = t; this.showMenu = false; window.scrollTo({ top:0 }); },
    accent() { return { children:'#0E9BA8', news:'#7C4DE0', lesson:'#2E6BE6', today:'#0FA47B', talk:'#E39A0C', idea:'#E0567F' }[this.tab]; },
    fabLabel() { return { children: this.editingId ? 'Мэдээлэл засах' : 'Хүүхэд нэмэх', news:'Мэдээлэл нэмэх', lesson:'Үйл ажиллагаа нэмэх', today:'Ажиглалт нэмэх', talk:'Ярилцлага нэмэх' }[this.tab] || ''; },
    catStyle(c) {
      const m = { 'Зарлал':'#2E6BE6', 'Мэдээ':'#0FA47B', 'Сануулга':'#E39A0C', 'Баяр ёслол':'#E0567F' };
      const c1 = m[c] || '#5A648A';
      return `background:${c1}1A; color:${c1}`;
    },
    say(m) { this.toast = m; setTimeout(() => this.toast = '', 2600); },
    fail(e) { console.error(e); this.say('Алдаа: ' + (e.message || e)); this.busy = false; },
    get filteredLessons() {
      const l = this.areaFilter === 'Бүгд' ? this.lessons : this.lessons.filter(x => x.area === this.areaFilter);
      return [...l].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    },
    get filteredTalks() {
      return this.talkFilter === 'Бүгд' ? this.talks : this.talks.filter(t => t.who === this.talkFilter);
    },
    get filteredToday() {
      return this.whoFilter === 'Бүгд' ? this.today : this.today.filter(t => t.who === this.whoFilter);
    },

    filesHtml(files) {
      const imgs = files.filter(f => (f.type || '').startsWith('image/'));
      const docs = files.filter(f => !(f.type || '').startsWith('image/'));
      let h = '';
      if (imgs.length) {
        h += `<div style="display:grid; grid-template-columns:repeat(${imgs.length > 1 ? 2 : 1},1fr); gap:8px">`;
        imgs.forEach(f => { h += `<a class="thumb" style="display:block" href="${esc(f.url)}" target="_blank" rel="noopener"><img src="${esc(f.url)}" alt="${esc(f.name)}" loading="lazy"></a>`; });
        h += `</div>`;
      }
      if (docs.length) {
        h += `<div style="display:grid; gap:6px; margin-top:${imgs.length ? '8px' : '0'}">`;
        docs.forEach(f => { h += `<a class="filechip" href="${esc(f.url)}" target="_blank" rel="noopener">📎 <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span></a>`; });
        h += `</div>`;
      }
      return h;
    },

    /* ---- өгөгдөл ---- */
    async load() {
      try {
        const [st, nf, dl, iv, fb, la] = await Promise.all([
          sb.from('students').select(this.staff ? '*' : 'id,name').order('name'),
          sb.from('news_feed').select('*').order('created_at', { ascending:false }),
          sb.from('daily_observations').select('*').order('created_at', { ascending:false }),
          sb.from('interview_notes').select('*').order('created_at', { ascending:false }),
          sb.from('parent_feedbacks').select('*').order('created_at', { ascending:false }),
          sb.from('learning_activities').select('*').order('activity_date', { ascending:false })
        ]);
        const bad = [st, nf, dl, iv, fb, la].find(r => r.error);
        if (bad) throw bad.error;

        this.students = st.data.map(r => ({
          id:r.id, name:r.name, age:r.age || '', gender:r.gender || '',
          parentName:r.parent_name || '', parentPhone:r.parent_phone || '',
          note:r.note || '', files:r.files || [],
          photo:(r.files || []).filter(x => (x.type || '').startsWith('image/')).map(x => x.url)[0] || ''
        }));
        this.students = sortStudents(this.students);
        this.news  = nf.data.map(r => ({ id:r.id, title:r.title, category:r.category || 'Мэдээ',
                                         content:r.content, date:day(r.created_at), files:r.files || [] }));
        this.today = dl.data.map(r => ({ id:r.id, title:r.subject, content:r.content,
                                         who:r.student_name || 'Дунд бүлэг',
                                         date:r.activity_date || day(r.created_at), files:r.files || [] }));
        this.talks = iv.data.map(r => ({ id:r.id, question:r.question, response:r.response || '',
                                         who:r.student_name || 'Дунд бүлэг',
                                         date:day(r.created_at), files:r.files || [] }));
        this.ideas = fb.data.map(r => ({ id:r.id, sender:r.sender, type:r.type,
                                         content:r.content, date:day(r.created_at) }));
        this.lessons = la.data.map(r => ({ id:r.id, date:r.activity_date || day(r.created_at),
                                           area:r.area || 'Бусад', topic:r.topic, goal:r.goal || '',
                                           content:r.content || '', materials:r.materials || '',
                                           files:r.files || [] }));
        this.dbStatus = 'online';
      } catch (e) {
        this.dbStatus = 'error';
        this.dbError = e.message || String(e);
        console.error(e);
      }
    },

    /* ---- сурагчид ---- */
    async addStudent() {
      const name = this.newStudent.trim();
      if (!name) return;
      try {
        const { data, error } = await sb.from('students').insert({ name }).select().single();
        if (error) throw error;
        this.students.push({ id:data.id, name:data.name, age:'', gender:'', parentName:'', parentPhone:'', note:'', files:[], photo:'' });
        this.students = sortStudents(this.students);
        this.newStudent = '';
        this.say(name + ' нэмэгдлээ');
      } catch (e) { this.fail(e); }
    },
    async delStudent(s) {
      try {
        const { error } = await sb.from('students').delete().eq('id', s.id);
        if (error) throw error;
        this.students = this.students.filter(x => x.id !== s.id);
      } catch (e) { this.fail(e); }
    },

    /* ---- файл ---- */
    pickFiles(ev) {
      this.staged = [...this.staged, ...Array.from(ev.target.files)];
      ev.target.value = '';
    },
    async upload() {
      const out = [];
      for (const f of this.staged) {
        const safe = f.name.replace(/[^\w.\-]/g, '_');
        const path = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '_' + safe;
        const { error } = await sb.storage.from(BUCKET).upload(path, f, { contentType: f.type || undefined });
        if (error) throw error;
        const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
        out.push({ name: f.name, url: data.publicUrl, type: f.type || '' });
      }
      return out;
    },

    /* ---- пост ---- */
    openForm(edit) {
      this.staged = [];
      this.editingId = '';
      if (edit) {
        this.editingId = edit.id;
        this.form = { name:edit.name, age:edit.age, gender:edit.gender || 'Хүү',
                      parentName:edit.parentName, parentPhone:edit.parentPhone, note:edit.note,
                      title:'', category:'Зарлал', content:'',
                      date:new Date().toISOString().split('T')[0], who:'Дунд бүлэг',
                      area:'Хэл яриа', topic:'', goal:'', materials:'', question:'', response:'' };
        this.formOpen = true;
        return;
      }
      this.form = {
        name:'', age:'', gender:'Хүү', parentName:'', parentPhone:'', note:'',
        title:'', category:'Зарлал', content:'',
        date:new Date().toISOString().split('T')[0], who:'Дунд бүлэг',
        area:'Хэл яриа', topic:'', goal:'', materials:'',
        question:'', response:''
      };
      this.formOpen = true;
    },

    async savePost() {
      if (this.busy) return;
      const f = this.form;
      if (this.tab === 'news'  && (!f.title.trim() || !f.content.trim())) return this.say('Гарчиг, агуулгыг бөглөнө үү');
      if (this.tab === 'today' && (!f.title.trim() || !f.content.trim())) return this.say('Гарчиг, тайлбарыг бөглөнө үү');
      if (this.tab === 'talk'  && !f.question.trim())                     return this.say('Асуултаа бичнэ үү');
      if (this.tab === 'lesson' && !f.topic.trim())                       return this.say('Сэдвээ бичнэ үү');
      if (this.tab === 'children' && !f.name.trim())                      return this.say('Овог нэрийг бичнэ үү');

      this.busy = true;
      try {
        const files = await this.upload();

        if (this.tab === 'children') {
          const row = {
            name:f.name.trim(), age:f.age ? Number(f.age) : null, gender:f.gender,
            parent_name:f.parentName || null, parent_phone:f.parentPhone || null, note:f.note || null
          };
          let saved;
          if (this.editingId) {
            const cur = this.students.find(x => x.id === this.editingId);
            row.files = [...(cur ? cur.files : []), ...files];
            const { data, error } = await sb.from('students').update(row).eq('id', this.editingId).select().single();
            if (error) throw error;
            saved = data;
          } else {
            row.files = files;
            const { data, error } = await sb.from('students').insert(row).select().single();
            if (error) throw error;
            saved = data;
          }
          const item = { id:saved.id, name:saved.name, age:saved.age || '', gender:saved.gender || '',
                         parentName:saved.parent_name || '', parentPhone:saved.parent_phone || '',
                         note:saved.note || '', files:saved.files || [],
                         photo:(saved.files || []).filter(x => (x.type || '').startsWith('image/')).map(x => x.url)[0] || '' };
          const ix = this.students.findIndex(x => x.id === saved.id);
          if (ix !== -1) this.students[ix] = item; else this.students.push(item);
          this.students = sortStudents(this.students);
          this.editingId = '';
        }

        if (this.tab === 'news') {
          const { data, error } = await sb.from('news_feed').insert({
            title:f.title, category:f.category, content:f.content, files
          }).select().single();
          if (error) throw error;
          this.news.unshift({ id:data.id, title:data.title, category:data.category,
                              content:data.content, date:day(data.created_at), files:data.files || [] });
        }

        if (this.tab === 'today') {
          const { data, error } = await sb.from('daily_observations').insert({
            subject:f.title, content:f.content, activity_date:f.date,
            student_name:f.who, files
          }).select().single();
          if (error) throw error;
          this.today.unshift({ id:data.id, title:data.subject, content:data.content,
                               who:data.student_name || 'Дунд бүлэг',
                               date:data.activity_date || day(data.created_at), files:data.files || [] });
        }

        if (this.tab === 'lesson') {
          const { data, error } = await sb.from('learning_activities').insert({
            activity_date:f.date, area:f.area, topic:f.topic,
            goal:f.goal || null, content:f.content || null, materials:f.materials || null, files
          }).select().single();
          if (error) throw error;
          this.lessons.unshift({ id:data.id, date:data.activity_date || day(data.created_at),
                                 area:data.area, topic:data.topic, goal:data.goal || '',
                                 content:data.content || '', materials:data.materials || '',
                                 files:data.files || [] });
        }

        if (this.tab === 'talk') {
          const { data, error } = await sb.from('interview_notes').insert({
            question:f.question, response:f.response || null, student_name:f.who, files
          }).select().single();
          if (error) throw error;
          this.talks.unshift({ id:data.id, question:data.question, response:data.response || '',
                               who:data.student_name || 'Дунд бүлэг',
                               date:day(data.created_at), files:data.files || [] });
        }

        this.staged = [];
        this.formOpen = false;
        this.busy = false;
        this.say('Нийтэллээ');
      } catch (e) { this.fail(e); }
    },

    async sendIdea() {
      if (this.busy) return;
      if (!this.ideaForm.sender.trim() || !this.ideaForm.content.trim()) return this.say('Нэр, агуулгаа бөглөнө үү');
      this.busy = true;
      try {
        const { data, error } = await sb.from('parent_feedbacks').insert({
          sender:this.ideaForm.sender, type:this.ideaForm.type, content:this.ideaForm.content
        }).select().single();
        if (error) throw error;
        this.ideas.unshift({ id:data.id, sender:data.sender, type:data.type,
                             content:data.content, date:day(data.created_at) });
        this.ideaForm.content = '';
        this.busy = false;
        this.say('Санал илгээгдлээ. Баярлалаа!');
      } catch (e) { this.fail(e); }
    },

    async removeItem(table, key, id) {
      try {
        const { error } = await sb.from(table).delete().eq('id', id);
        if (error) throw error;
        this[key] = this[key].filter(x => x.id !== id);
        this.say('Устгалаа');
      } catch (e) { this.fail(e); }
    }
  };
}
</script>
